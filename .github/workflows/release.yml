name: release

# Tag a version (v1.0.0) and this workflow builds the three artifacts and publishes them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build the Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: build everything
        shell: pwsh
        run: ./packaging/build.ps1

      - name: collect the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArkLoad
          path: |
            release/ArkLoad-Setup.exe
            dist/ArkLoad.exe
            dist/ArkLoad/ArkLoad.exe

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ArkLoad-Setup.exe
            dist/ArkLoad.exe
          draft: false
          generate_release_notes: true
