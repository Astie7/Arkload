name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (the target platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the dependencies
        run: pip install -r requirements.txt pytest
      - name: run the tests
        run: pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  linux:
    name: Linux (the engine only, the window is skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the dependencies
        run: pip install -r requirements.txt pytest
      - name: run the tests
        run: pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
