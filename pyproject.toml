[project]
name = "arkload"
version = "1.0.0"
description = "ArkLoad Download Manager: a desktop download manager for MediaFire folders and files with resumption, per file status detection and SHA-256 integrity verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
arkload = "tools.arkload.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
